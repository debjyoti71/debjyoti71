<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="76" viewBox="0 0 1100 76" role="img" aria-labelledby="title desc">
<title id="title">Living Data Stream Divider</title>
<desc id="desc">A slim animated cyan data stream separating GitHub profile sections.</desc>
<defs>
 <linearGradient id="line" x1="0" x2="1"><stop stop-color="#0b1220" stop-opacity="0"/><stop offset=".25" stop-color="#0891b2"/><stop offset=".5" stop-color="#22d3ee"/><stop offset=".75" stop-color="#0891b2"/><stop offset="1" stop-color="#0b1220" stop-opacity="0"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<path d="M20 38 H1080" stroke="#153047" stroke-width="2" fill="none"/>
<path d="M20 38 H1080" stroke="url(#line)" stroke-width="1.5" fill="none"/>
<g fill="#22d3ee" filter="url(#glow)">
 <circle cy="38" r="3"><animate attributeName="cx" values="20;1080" dur="4s" repeatCount="indefinite"/></circle>
 <circle cy="38" r="2.5" opacity=".8"><animate attributeName="cx" values="1080;20" dur="5s" repeatCount="indefinite"/></circle>
 <circle cy="38" r="2"><animate attributeName="cx" values="20;1080" dur="3s" begin="-1.3s" repeatCount="indefinite"/></circle>
 <circle cy="38" r="4" fill="#8b5cf6" opacity=".75"><animate attributeName="cx" values="20;1080" dur="6s" begin="-2.4s" repeatCount="indefinite"/></circle>
</g>
<g fill="#164e63" opacity=".8">
 <circle cx="160" cy="38" r="4"/><circle cx="390" cy="38" r="3"/><circle cx="700" cy="38" r="4"/><circle cx="940" cy="38" r="3"/>
</g>
</svg>