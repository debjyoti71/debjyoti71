  <text x="28" y="101" font-family="monospace" font-size="16" fill="#22d3ee">&gt; <tspan fill="#e2f7ff">initialize_profile</tspan><tspan fill="#94a3b8"> --mode=systems</tspan></text>
  <rect x="28" y="115" width="5" height="5" rx="1" fill="#34d399"/>
