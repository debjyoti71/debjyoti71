  <circle cx="680" cy="106" r="4" fill="#22d3ee" filter="url(#glow)"/>
  <text x="693" y="110" font-family="monospace" font-size="11.5" fill="#d9f7ff">MODEL ROUTER</text>
  <text x="679" y="130" font-family="monospace" font-size="10.5" fill="#5eead4">MULTI-PROVIDER READY</text>
  <rect x="871" y="88" width="199" height="55" rx="9" fill="#11172c" stroke="#433778"/>
  <circle cx="889" cy="106" r="4" fill="#a78bfa" filter="url(#glow)"/>
  <text x="902" y="110" font-family="monospace" font-size="11.5" fill="#e9e3ff">MEMORY GRAPH</text>
  <text x="888" y="130" font-family="monospace" font-size="10.5" fill="#c4b5fd">CONTEXT PRESERVED</text>
  <rect x="662" y="154" width="196" height="55" rx="9" fill="#0b1b2a" stroke="#164e63"/>
  <circle cx="680" cy="172" r="4" fill="#34d399" filter="url(#glow)"/>
  <text x="693" y="176" font-family="monospace" font-size="11.5" fill="#d9f7ff">TOOL RUNTIME</text>
  <text x="679" y="196" font-family="monospace" font-size="10.5" fill="#6ee7b7">WORKFLOWS STANDING BY</text>
  <rect x="871" y="154" width="199" height="55" rx="9" fill="#11172c" stroke="#433778"/>
  <circle cx="889" cy="172" r="4" fill="#a78bfa" filter="url(#glow)"/>
  <text x="902" y="176" font-family="monospace" font-size="11.5" fill="#e9e3ff">RESEARCH OPS</text>
  <text x="888" y="196" font-family="monospace" font-size="10.5" fill="#c4b5fd">SEARCH / RETRIEVE / SYNTHESIZE</text>
  <path d="M662 224H1070" stroke="#1d3448" stroke-width="1"/>
  <text x="662" y="246" font-family="monospace" font-size="10.5" fill="#64748b">PYTHON</text>
  <circle cx="719" cy="242" r="2" fill="#22d3ee"/>
  <text x="731" y="246" font-family="monospace" font-size="10.5" fill="#64748b">AGENTIC AI</text>
  <circle cx="812" cy="242" r="2" fill="#22d3ee"/>
  <text x="824" y="246" font-family="monospace" font-size="10.5" fill="#64748b">SYSTEMS THINKING</text>
  <rect x="658" y="258" width="420" height="2" fill="url(#beam)" opacity=".9" filter="url(#glow)">
    <animate attributeName="x" values="658;780;658" dur="4s" repeatCount="indefinite"/>
