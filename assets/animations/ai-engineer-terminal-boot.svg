    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;.21;.29;.74;.92;1" dur="6s" repeatCount="indefinite"/>
  </text>
  <rect x="28" y="175" width="5" height="5" rx="1" fill="#34d399" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;.35;.43;.74;.92;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="43" y="181" font-family="monospace" font-size="13.5" fill="#a7c6db" opacity="0">[00:03] Connecting memory &amp; knowledge <tspan fill="#22d3ee">SQLite / retrieval</tspan>
    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;.35;.43;.74;.92;1" dur="6s" repeatCount="indefinite"/>
  </text>
  <rect x="28" y="205" width="5" height="5" rx="1" fill="#34d399" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;.49;.57;.74;.92;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="43" y="211" font-family="monospace" font-size="13.5" fill="#a7c6db" opacity="0">[00:04] Research pipeline <tspan fill="#34d399">READY</tspan>
    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;.49;.57;.74;.92;1" dur="6s" repeatCount="indefinite"/>
  </text>
