<svg xmlns="http://www.w3.org/2000/svg" width="960" height="224" viewBox="0 0 960 224" role="img" aria-labelledby="title desc">
<title id="title">AI Engineer Terminal Boot</title>
<desc id="desc">Animated terminal boot sequence for Debjyoti Ghosh's AI engineering profile.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
  <linearGradient id="edge"><stop stop-color="#0891b2"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="2" y="2" width="956" height="220" rx="15" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/>
<rect x="3" y="3" width="954" height="37" rx="14" fill="#101e30"/>
<circle cx="24" cy="21" r="5" fill="#fb7185"/><circle cx="42" cy="21" r="5" fill="#fbbf24"/><circle cx="60" cy="21" r="5" fill="#34d399"/>
<text x="84" y="26" font-family="monospace" font-size="14" fill="#94a3b8" letter-spacing="2">DEBJYOTI // AI ENGINEERING TERMINAL</text>
<text x="28" y="72" font-family="monospace" font-size="17" fill="#22d3ee">&gt; booting debjyoti.ai <tspan fill="#94a3b8">...</tspan></text>
<text x="28" y="108" font-family="monospace" font-size="17" fill="#a5f3fc" opacity="0"> &gt; loading models: ML / LLM / CV
  <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;.14;.22;.72;.9;1" dur="5s" repeatCount="indefinite"/>
</text>
<text x="28" y="144" font-family="monospace" font-size="17" fill="#a5f3fc" opacity="0">&gt; initializing agent workflows
  <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.28;.38;.46;.9;1" dur="5s" repeatCount="indefinite"/>
</text>
<text x="28" y="180" font-family="monospace" font-size="17" fill="#a5f3fc" opacity="0">&gt; research pipeline: READY
  <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;.45;.54;.62;.7;.9;1" dur="5s" repeatCount="indefinite"/>
</text>
<rect x="282" y="164" width="10" height="19" rx="2" fill="#22d3ee" filter="url(#glow)">
  <animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/>
  <animate attributeName="x" values="282;282;510;510" keyTimes="0;.6;.72;1" dur="5s" repeatCount="indefinite"/>
</rect>
<text x="930" y="199" text-anchor="end" font-family="monospace" font-size="12" fill="#64748b">SYSTEM STATUS // <tspan fill="#34d399">ONLINE</tspan></text>
</svg>