<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Debjyoti Ghosh — AI engineer and researcher</title>
  <desc id="desc">Minimal dark navy banner with editorial typography, a restrained cyan signal motif, and engineering disciplines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D19"/><stop offset=".65" stop-color="#101B30"/><stop offset="1" stop-color="#092633"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".8"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity=".055" stroke-width="1"/></pattern>
    <radialGradient id="glow"><stop stop-color="#0891B2" stop-opacity=".22"/><stop offset="1" stop-color="#0891B2" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <ellipse cx="1010" cy="142" rx="260" ry="190" fill="url(#glow)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M760 52H845Q865 52 865 72V106H1020Q1040 106 1040 126V152H1165" stroke="#22D3EE" stroke-opacity=".3" stroke-width="1.4"/>
    <path d="M760 252H850Q870 252 870 232V210H1000Q1020 210 1020 190V176H1165" stroke="#2DD4BF" stroke-opacity=".28" stroke-width="1.4"/>
    <path d="M900 36V70M883 53H917" stroke="#67E8F9" stroke-opacity=".35"/>
    <path d="M720 150H770Q790 150 790 130V118H825" stroke="#38BDF8" stroke-opacity=".22"/>
  </g>
  <g fill="#67E8F9">
    <circle cx="865" cy="52" r="2.8"><animate attributeName="opacity" values=".35;1;.35" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="106" r="2.8"><animate attributeName="opacity" values="1;.35;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="232" r="2.8"><animate attributeName="opacity" values=".35;1;.35" dur="4.4s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(1000 152)" fill="none">
    <circle r="84" stroke="#38BDF8" stroke-opacity=".15"/>
    <circle r="62" stroke="#38BDF8" stroke-opacity=".25" stroke-dasharray="2 9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/></circle>
    <circle r="38" stroke="#2DD4BF" stroke-opacity=".32" stroke-dasharray="1 8"/>
    <path d="M-96 0H96M0-96V96" stroke="#67E8F9" stroke-opacity=".12"/>
    <circle r="7" fill="#0891B2" fill-opacity=".4" stroke="#67E8F9" stroke-opacity=".8"/>
  </g>
  <path d="M0 286H1200" stroke="url(#line)" stroke-width="1.5"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="64" y="70" fill="#67E8F9" font-size="12" font-weight="700" letter-spacing="3.2">AI SYSTEMS  /  SECURITY  /  RESEARCH</text>
    <text x="60" y="137" fill="#F8FAFC" font-size="52" font-weight="720" letter-spacing="-1.8">Debjyoti Ghosh</text>
    <text x="64" y="173" fill="#CBD5E1" font-size="17">I build intelligent systems with an engineering mindset.</text>
    <g font-size="11" font-weight="600" letter-spacing=".6">
      <text x="64" y="224" fill="#A5F3FC">APPLIED AI</text><circle cx="143" cy="220" r="2" fill="#22D3EE"/>
      <text x="158" y="224" fill="#A5F3FC">CYBERSECURITY</text><circle cx="265" cy="220" r="2" fill="#22D3EE"/>
      <text x="280" y="224" fill="#A5F3FC">RESEARCH</text><circle cx="360" cy="220" r="2" fill="#22D3EE"/>
      <text x="375" y="224" fill="#A5F3FC">BACKEND SYSTEMS</text>
    </g>
  </g>
</svg>